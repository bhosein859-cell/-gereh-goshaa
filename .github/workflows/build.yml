# ═══════════════════════════════════════════════════════════════
# ساخت خودکار فایل‌های نصبی گره‌گشا روی سرورهای گیت‌هاب
# خروجی‌ها (از بخش Artifacts هر اجرا):
#   📱  GerehGosha-1.0.0.apk          نصبی اندروید
#   🪟  GerehGosha-1.0.0-Windows.zip  نسخه‌ی قابل‌حمل ویندوز
#   🪟  GerehGosha-1.0.0.msix         بسته‌ی مدرن ویندوز
# ═══════════════════════════════════════════════════════════════
name: ساخت نصبی اندروید و ویندوز

on:
  workflow_dispatch:   # اجرای دستی از تب Actions
  push:
    branches: [main]

jobs:
  # ─────────────── 📱 اندروید ───────────────
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: ساخت اسکلت اندروید
        run: flutter create --platforms=android --org ir.bakhtiari --project-name gereh_gosha .

      - name: نام فارسی اپ و مجوز میکروفون
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="gereh_gosha"/android:label="گره‌گشا"/' $M
          grep -q RECORD_AUDIO $M || \
            sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <application|' $M

      - name: دریافت وابستگی‌ها
        run: flutter pub get

      - name: ساخت آیکون اپ
        run: dart run flutter_launcher_icons

      - name: ساخت نسخه‌ی انتشار
        run: flutter build apk --release

      - name: آماده‌سازی خروجی
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/GerehGosha-1.0.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GerehGosha-1.0.0-Android
          path: dist/GerehGosha-1.0.0.apk
          retention-days: 60

  # ─────────────── 🪟 ویندوز ───────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: ساخت اسکلت ویندوز
        run: flutter create --platforms=windows --org ir.bakhtiari --project-name gereh_gosha .

      - name: دریافت وابستگی‌ها
        run: flutter pub get

      - name: ساخت آیکون اپ
        run: dart run flutter_launcher_icons

      - name: ساخت نسخه‌ی انتشار
        run: flutter build windows --release

      - name: ساخت بسته‌ی ام‌اس‌آی‌اکس
        run: dart run msix:create
        continue-on-error: true   # اگر به هر دلیل نشد، زیپ همچنان آماده است

      - name: آماده‌سازی خروجی‌ها
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "dist\GerehGosha-1.0.0-Windows.zip" -Force
          $msix = Get-ChildItem -Recurse -Filter *.msix -Path build | Select-Object -First 1
          if ($msix) { Copy-Item $msix.FullName "dist\GerehGosha-1.0.0.msix" }

      - uses: actions/upload-artifact@v4
        with:
          name: GerehGosha-1.0.0-Windows
          path: |
            dist/GerehGosha-1.0.0-Windows.zip
            dist/GerehGosha-1.0.0.msix
          retention-days: 60
